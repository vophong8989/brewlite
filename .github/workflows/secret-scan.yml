name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks & .env Guard)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block committed .env files
        run: |
          TRACKED_ENV=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.env\.example$' || true)
          if [ -n "$TRACKED_ENV" ]; then
            echo "Lỗi bảo mật: Phát hiện file .env được commit lên repo:"
            echo "$TRACKED_ENV"
            exit 1
          fi

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          CHECKSUMS="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "${BASE_URL}/${ARCHIVE}" -o "${ARCHIVE}"
          curl -sSfL "${BASE_URL}/${CHECKSUMS}" -o "${CHECKSUMS}"
          sha256sum --ignore-missing -c "${CHECKSUMS}"
          tar -xzf "${ARCHIVE}" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f "${ARCHIVE}" "${CHECKSUMS}"

      - name: Run Gitleaks scan
        run: gitleaks detect --source . --verbose --redact